# 定义后端服务器
upstream app_backend {
    zone app_backend 64K;
    server 127.0.0.1:8088;  # 或您的实际后端端口
    keepalive 32;
}

# HTTP 服务器 - 自动跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.admin.a1cc.site;

    access_log /var/log/nginx/app.admin.a1cc.site_access_80.log;   # ✅ 建议包含域名
    error_log /var/log/nginx/app.admin.a1cc.site_error_80.log;     # ✅ 建议包含域名

    return 301 https://$server_name$request_uri;
}

# HTTPS 服务器
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.admin.a1cc.site;

    underscores_in_headers on;

    access_log /var/log/nginx/app.admin.a1cc.site_access_443.log;  # ✅ 建议包含域名
    error_log /var/log/nginx/app.admin.a1cc.site_error_443.log;    # ✅ 建议包含域名

    # React 前端静态文件路径
    root /home/ubuntu/www/app.admin.a1cc.site;
    index index.html;

    # 处理 React 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 缓存静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # ===== WebSocket 专用路径 =====
    location /wss {
        proxy_pass http://app_backend/wss;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ===== 反向代理 API 请求 =====
    location /backend/ {
        proxy_pass http://app_backend/;
        proxy_redirect off;
        proxy_pass_header Authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 0;
        proxy_read_timeout 36000s;
    }

    # SSL 证书配置
    ssl_certificate /etc/letsencrypt/live/app.admin.a1cc.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.admin.a1cc.site/privkey.pem;
}

