# HTTP 服务器 - 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.a1cc.site;
    
    # 如果请求的是 HTTP，重定向到 HTTPS
    if ($scheme != "https") {
        return 301 https://$server_name$request_uri;
    }
    
    # 或者更简洁的方式：
    # return 301 https://$server_name$request_uri;
}

# HTTPS 服务器 - 主配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.a1cc.site;

    # SSL 证书路径（Certbot 会自动配置）
    ssl_certificate /etc/letsencrypt/live/app.a1cc.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.a1cc.site/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/app.a1cc.site/chain.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 网站根目录
    root /home/ubuntu/www/app.a1cc.site;
    index index.html;

    # React 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 日志
    access_log /var/log/nginx/app.a1cc.site_access.log;
    error_log /var/log/nginx/app.a1cc.site_error.log;
}
